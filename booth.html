<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light only">
    <title>Photo Booth</title>
    <!-- Favicon Link -->
    <link rel="icon" type="image/x-icon" href="assets/img/favicon.ico">
    <!-- CSS Link -->
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>

    <!-- Audio Element -->
    <audio id="hoverSound">
        <source src="assets/music/bubble-sound.mp3" type="audio/mpeg">
    </audio>

    <audio id="clickSound">
        <source src="assets/music/shine-sound.mp3" type="audio/mpeg">
    </audio>

    <audio id="cameraSound">
        <source src="assets/music/camera-sound.mp3" type="audio/mpeg">
    </audio>

    <!-- Top Nav Bar -->
    <div class="topnav">
        <img src="assets/img/logo.png" id="logo">
    </div>

    <!-- Main Container -->
    <div class="container-main">

        <!-- Frame Selection -->
        <div id="templateSelection">

            <!-- Frame Header -->
            <div id="frameHeader">

                <!-- Back Button -->
                <button id="backToCategories" class="hidden" aria-label="Back to categories">
                    <svg viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M38,52a2,2,0,0,1-1.41-.59l-24-24a2,2,0,0,1,0-2.82l24-24a2,2,0,0,1,2.82,0,2,2,0,0,1,0,2.82L16.83,26,39.41,48.59A2,2,0,0,1,38,52Z"/>
                    </svg>
                </button>


                <!-- Title -->
                <h2 id="frameTitle">
                    Choose A Layout
                </h2>

            </div>


            <!-- Selection options load here (orientation, then photo count) -->
            <div id="frameCategories"></div>


            <!-- Frames will load here -->
            <div class="frames hidden" id="framesContainer"></div>

            <!-- Frame Preview -->
            <div id="framePreview" class="hidden">

                <div class="previewModal">
            
                    <h2 id="previewTitle"></h2>
            
                    <img id="previewFrameImage" alt="Selected frame preview">
            
            
                    <div class="previewButtons">
            
                        <button id="cancelFrame">
                            Cancel
                        </button>
            
                        <button id="confirmFrame">
                            Use This Frame
                        </button>
            
                    </div>
            
                </div>
            
            </div>


        </div>

        <!-- Photo Booth -->
        <div id="photoBooth" class="hidden">

            <div id="cameraContainer">

                <video id="video" autoplay playsinline></video>

                <img id="photoPreview" class="hidden" alt="Selected captured photo">
        
                <div id="countdown" class="hidden">
                    3
                </div>
        
            </div>

            <div id="capturedPhotosPreview" class="hidden" aria-live="polite"></div>

            <div id="captureReviewActions" class="hidden">
                <button type="button" id="retakeReview">Retake This Photo</button>
                <button type="button" id="retakeAll">Retake All Photos</button>
                <button type="button" id="confirmReview">Use Photos</button>
            </div>
        
            <p id="photoCountDisplay"></p>
        
            <img src="assets/img/snap_btn.png" id="takeSnapBtn" class="hidden">

        </div>

        <!-- Second Container -->
        <div class="container-second hidden" id="stripDownload">
            <!-- Photo Strip Container -->
            <div id="photoStripContainer" class="hidden">
                <!-- Canvas -->
                <canvas id="canvas"></canvas>
                <canvas id="editorCanvas"></canvas>
            </div>

            <!-- Editor Container -->
            <div id="editorContainer" class="hidden">

                <!-- Editor Toolbar -->
                <div id="editorToolbar">
            
                    <button id="filterTool">Filters</button>
                    <button id="textTool">Text</button>
                    <button id="stickerTool">Stickers</button>
            
                </div>
            
                <!-- Editor Panel -->
                <div id="editorPanel">

                    <!-- Filter Panel -->
                    <div id="filtersPanel" class="hidden">

                        <button type="button" class="filter-option active" data-filter="none" aria-label="Original">
                            <span class="filter-swatch filter-swatch--none"></span>
                            <span class="filter-label">Original</span>
                        </button>

                        <button type="button" class="filter-option" data-filter="grayscale" aria-label="Black and white">
                            <span class="filter-swatch filter-swatch--grayscale"></span>
                            <span class="filter-label">B&amp;W</span>
                        </button>

                        <button type="button" class="filter-option" data-filter="sepia" aria-label="Sepia">
                            <span class="filter-swatch filter-swatch--sepia"></span>
                            <span class="filter-label">Sepia</span>
                        </button>

                        <button type="button" class="filter-option" data-filter="vintage" aria-label="Vintage">
                            <span class="filter-swatch filter-swatch--vintage"></span>
                            <span class="filter-label">Vintage</span>
                        </button>

                        <button type="button" class="filter-option" data-filter="warm" aria-label="Warm">
                            <span class="filter-swatch filter-swatch--warm"></span>
                            <span class="filter-label">Warm</span>
                        </button>

                    </div>

                    <!-- Text Input Panel -->
                    <div id="textPanel" class="hidden">
                        <div class="input-container">
                            <input type="text" id="textField" placeholder="Enter your text" autocomplete="off">
                            <button type="button" id="addText">Add</button>
                        </div>

                        <div id="textColorContainer">
                            <label for="textColor">Font Color</label>
                            <input type="color" id="textColor" value="#000000" aria-label="Choose font color">
                        </div>

                        <div id="textFontContainer">
                            <button type="button" class="fontOption active" data-font="Arial" style="font-family: Arial;">Arial</button>
                            <button type="button" class="fontOption" data-font="Georgia" style="font-family: Georgia;">Georgia</button>
                            <button type="button" class="fontOption" data-font="'Courier New'" style="font-family: 'Courier New';">Courier</button>
                        </div>

                        <div class="textInstructions">
                            <ul>
                                <li>Drag the text to place it on the strip.</li>
                                <li>Long-press the text on the Text to delete it.</li>
                            </ul>
                        </div>
                    </div>

                    <!-- Stickers Panel -->
                    <div id="stickersPanel" class="hidden">
                    </div>
            
                </div>

                <!-- Download Btn -->
                <img src="assets/img/download_btn.png" id="download" class="hidden">
            
            </div>
        </div>

        <!-- Image -->
        <img src="assets/img/girl_1.png" id="girlImg" class="hidden">

    </div>


    <!-- Thanks Section -->
    <img src="assets/img/thanks_img.png" id="thanksImage" class="hidden">
    <img src="assets/img/girl_2.png" id="girlImg2" class="hidden">


    <!-- JS Links (order matters: shared state first, data bootstrap last) -->
    <script src="assets/js/booth/state.js"></script>
    <script src="assets/js/booth/camera.js"></script>
    <script src="assets/js/booth/countdown.js"></script>
    <script src="assets/js/booth/frames.js"></script>
    <script src="assets/js/booth/capture.js"></script>
    <script src="assets/js/booth/review.js"></script>
    <script src="assets/js/booth/strip.js"></script>
    <script src="assets/js/booth/editor.js"></script>
    <script src="assets/js/booth/data.js"></script>

</body>

</html>
